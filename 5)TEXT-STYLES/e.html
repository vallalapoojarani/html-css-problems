<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            text-align: center;
        }
        .one{
            color:orange;
            margin-top: 0;
            margin-bottom: 0;
        }
        .two{
            font-weight: bold;
            margin-top: 0;
            font-size: 25px;
            margin-bottom: 0px;
        }
        .one2{
            font-size: 50px;
            margin-top: 0px;
            font-weight: bold;
            margin-bottom: 0;

        }
        .one3{
            font-size: 15px;
            margin-bottom: 25px;
        }
        .button{
            border-radius: 10px;
            background-color: blue;
            color: white;
            padding-bottom: 7px;
            padding-top: 7px;
            padding-left: 15px;
            padding-right: 15px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <p class="one">new</p>
    <p class="two">macbook pro</p>
    <p class="one2">supercharged for pros.</p>
    <p class="one3">from $1999</p>
    <p>
        <span class="button">buy</span>
    </p>
</body>
</html>
